kind = "web"
previewPath = "/"
title = "AKN Group"
version = "1.0.0"
id = "artifacts/akngroup"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/", "/api" ]
localPort = 25287

[services.development]
run = "pnpm --filter @workspace/akngroup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/akngroup", "run", "build" ]
publicDir = "artifacts/akngroup/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25287"
BASE_PATH = "/"
